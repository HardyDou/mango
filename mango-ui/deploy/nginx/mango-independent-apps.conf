# Three independently opened frontend applications sharing one backend.
# Replace the roots and backend upstream with deployment-specific values.
# The trailing slash in proxy_pass intentionally removes the browser-facing
# /api/ prefix before forwarding the request to the Java service.

upstream mango_backend {
    server mango-backend:18081;
    keepalive 32;
}

server {
    listen 8081;
    server_name _;

    root /srv/mango/app-8081;
    index index.html;

    location /api/ {
        proxy_pass http://mango_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

