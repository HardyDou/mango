# Managed by Mango CLI. Use `mango pmo sync`; do not edit this file directly.
name: PMO Documentation Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pmo-doc-check-${{ github.event.pull_request.number || github.ref }}-${{ github.event.action == 'edited' && 'contract' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight_scope:
    name: Preflight and scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      backend_mode: ${{ steps.scope.outputs.backend_mode }}
      maven_projects: ${{ steps.scope.outputs.maven_projects }}
      maven_dependency_projects: ${{ steps.scope.outputs.maven_dependency_projects }}
      backend_root: ${{ steps.scope.outputs.backend_root }}
      backend_pom: ${{ steps.scope.outputs.backend_pom }}
      business_docs_root: ${{ steps.scope.outputs.business_docs_root }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Classify affected Maven scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node business-pmo/mango-baseline/tools/classify-pmo-check-scope.mjs \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --output "$GITHUB_OUTPUT"

  pmo:
    name: PMO contract gates
    needs: preflight_scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > .pr-body.md

      - name: Check impact-driven risk and verification contract
        env:
          PR_BODY_FILE: .pr-body.md
        run: node business-pmo/mango-baseline/tools/risk-verification.mjs

  docs:
    name: PMO document gates
    needs: preflight_scope
    if: github.event_name != 'pull_request' || github.event.action != 'edited'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check PMO document contracts
        env:
          BUSINESS_DOCS_ROOT: ${{ needs.preflight_scope.outputs.business_docs_root }}
        run: >-
          node business-pmo/mango-baseline/tools/check-document-set.mjs
          --root "$BUSINESS_DOCS_ROOT"

  backend:
    name: Affected backend gates
    needs: preflight_scope
    if: >-
      (github.event_name != 'pull_request' || github.event.action != 'edited') &&
      needs.preflight_scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build affected-module upstream dependencies
        if: >-
          needs.preflight_scope.outputs.backend_mode == 'partial' &&
          needs.preflight_scope.outputs.maven_dependency_projects != ''
        env:
          BACKEND_POM: ${{ needs.preflight_scope.outputs.backend_pom }}
          MAVEN_DEPENDENCY_PROJECTS: ${{ needs.preflight_scope.outputs.maven_dependency_projects }}
        run: >-
          mvn -B -ntp -f "$BACKEND_POM"
          -pl "$MAVEN_DEPENDENCY_PROJECTS"
          -am
          -DskipTests
          -Denforcer.skip=true
          -Dcheckstyle.skip=true
          -Dpmd.skip=true
          -Dspotbugs.skip=true
          install

      - name: Validate backend governance POMs
        if: needs.preflight_scope.outputs.backend_mode == 'governance'
        env:
          BACKEND_POM: ${{ needs.preflight_scope.outputs.backend_pom }}
        run: >-
          mvn -B -ntp -f "$BACKEND_POM"
          -pl architecture-verification
          -DskipTests
          help:effective-pom

      - name: Verify affected backend modules and Mango architecture
        if: needs.preflight_scope.outputs.backend_mode == 'partial'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          BACKEND_POM: ${{ needs.preflight_scope.outputs.backend_pom }}
          MAVEN_PROJECTS: ${{ needs.preflight_scope.outputs.maven_projects }}
        run: >-
          mvn -B -ntp -f "$BACKEND_POM"
          -pl "$MAVEN_PROJECTS"
          -Dmango.architecture.mode=changed
          -Dmango.architecture.base="$BASE_SHA"
          -Dmango.architecture.skip=false
          -Dmango.architecture.requireFullReactor=false
          -Dmango.check.rule=all
          -Dmango.check.gate=no-new-violations
          -Dmango.check.changedOnly=true
          -Dmango.check.baseRef="$BASE_SHA"
          -Dmango.check.requireFullScope=false
          -Dmango.check.staticFailurePolicy=block
          -Denforcer.skip=false
          verify

      - name: Generate trusted full-Reactor architecture inventory for governance
        if: needs.preflight_scope.outputs.backend_mode == 'governance'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          BACKEND_POM: ${{ needs.preflight_scope.outputs.backend_pom }}
        run: >-
          mvn -B -ntp -f "$BACKEND_POM"
          -DskipTests
          -Dmango.architecture.mode=changed
          -Dmango.architecture.base="$BASE_SHA"
          -Dmango.architecture.skip=false
          -Dmango.architecture.requireFullReactor=true
          -Dmango.architecture.inventoryOnly=true
          -Dmango.check.rule=all
          -Dmango.check.gate=no-new-violations
          -Dmango.check.changedOnly=true
          -Dmango.check.baseRef="$BASE_SHA"
          -Dmango.check.requireFullScope=true
          -Dmango.check.staticFailurePolicy=block
          -Denforcer.skip=false
          verify

      - name: Enforce project architecture debt budget policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
          BACKEND_MODE: ${{ needs.preflight_scope.outputs.backend_mode }}
          BACKEND_ROOT: ${{ needs.preflight_scope.outputs.backend_root }}
        run: |
          if [ "$BACKEND_MODE" = "governance" ]; then
            node business-pmo/mango-baseline/tools/check-architecture-debt-budget.mjs \
              --report "$BACKEND_ROOT/target/mango-architecture-report.json" \
              --baseline business-pmo/architecture-debt-budget.json \
              --allow-missing-for-governance-upgrade \
              --base-ref "$BASE_SHA"
          else
            node business-pmo/mango-baseline/tools/check-architecture-debt-budget.mjs \
              --baseline business-pmo/architecture-debt-budget.json \
              --baseline-only \
              --base-ref "$BASE_SHA"
          fi

  pmo-doc-check:
    name: pmo-doc-check
    needs: [preflight_scope, pmo, docs, backend]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate PMO gate results
        env:
          PREFLIGHT_SCOPE_RESULT: ${{ needs.preflight_scope.result }}
          PMO_RESULT: ${{ needs.pmo.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: |
          for result in \
            "$PREFLIGHT_SCOPE_RESULT" \
            "$PMO_RESULT" \
            "$DOCS_RESULT" \
            "$BACKEND_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
