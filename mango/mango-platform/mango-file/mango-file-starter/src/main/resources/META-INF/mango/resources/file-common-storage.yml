              type: STRING
              value: application/x-msdownload,application/x-sh
            directUploadEnabled:
              type: INT
              value: 0
            directUploadExpireSeconds:
              type: LONG
              value: 900
            accessTokenEnabled:
              type: INT
              value: 1
            publicReadRequiresToken:
              type: INT
              value: 1
            accessMode:
              type: STRING
              value: DIRECT
            accessTokenExpireSeconds:
              type: LONG
              value: 86400
            previewExpireSeconds:
              type: LONG
              value: 86400
            previewExternalExtensions:
              type: STRING
