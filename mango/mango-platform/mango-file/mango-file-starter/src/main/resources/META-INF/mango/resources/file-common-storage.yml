              type: STRING
              value: local
            storagePath:
              type: STRING
              value: mango-file
            pathStyleAccess:
              type: INT
              value: 0
            sslEnabled:
              type: INT
              value: 0
            active:
              type: INT
              value: 1
            status:
              type: INT
              value: 1
            remark:
              type: STRING
              value: 系统默认本地文件存储
      FILE_SETTINGS:
        - id: "2026061801000000101"
          version: 3
          biz-key: file.settings.default
          name: 文件中心默认配置
          target-module: file
          fields:
            settingsId:
              type: LONG
              value: 1
            tenantId:
              type: LONG
              value: 1
            maxSize:
              type: LONG
              value: 104857600
            blockedExtensions:
