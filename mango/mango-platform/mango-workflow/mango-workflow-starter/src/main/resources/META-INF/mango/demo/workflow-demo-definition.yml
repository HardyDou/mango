mango:
  resource:
    schema-version: 1
    module-code: workflow
    module-name: 工作流演示
    declarations:
      AUTH_ROLE_DATA_SCOPE:
        - id: "2026072209000000001"
          version: 1
          biz-key: workflow.role-data-scope.tenant-1-admin-definition-list
          name: 默认管理员流程定义管理数据权限
          target-module: workflow
          sync-mode: INIT_ONLY
          fields:
            tenantId: { type: LONG, value: 1 }
            appCode: { type: STRING, value: internal-admin }
            roleCode: { type: STRING, value: ROLE_ADMIN }
            resourceCode: { type: STRING, value: "workflow:definition:list" }
            scopeMode: { type: STRING, value: ALL }
      WORKFLOW_DEFINITION:
        - id: "2026071409000000001"
          version: 1
          biz-key: workflow.definition.expense-reimbursement
          name: 费用报销审批
          target-module: workflow
          sync-mode: INIT_ONLY
          fields:
            tenantId: { type: STRING, value: "1" }
            domainCode: { type: STRING, value: COMMON }
            categoryCode: { type: STRING, value: COMMON }
            categoryName: { type: STRING, value: 通用流程 }
            categorySort: { type: INT, value: 10 }
            categoryRemark: { type: STRING, value: 系统内置通用示例流程分类 }
            orgId: { type: LONG, value: 1 }
            adminUsers: { type: JSON, value: [admin] }
            startEntryVisible: { type: BOOLEAN, value: true }
            icon: { type: STRING, value: Money }
            definitionKey: { type: STRING, value: expense_reimbursement }
            definitionName: { type: STRING, value: 费用报销审批 }
            designerJson:
              type: FILE
              location: classpath:META-INF/mango/demo-assets/workflow/expense-reimbursement-designer.json
              encoding: UTF-8
            formCode: { type: STRING, value: form_expense_reimbursement }
            formJson:
              type: FILE
              location: classpath:META-INF/mango/demo-assets/workflow/expense-reimbursement-form.json
              encoding: UTF-8
            remark: { type: STRING, value: 费用报销业务示例，采用自定义申请页和自定义审批页，适合展示业务接入工作流。 }
        - id: "2026071409000000002"
