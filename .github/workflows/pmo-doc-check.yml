name: PMO Documentation Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pmo-doc-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight_scope:
    name: Preflight and scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pmo: ${{ steps.scope.outputs.pmo }}
      backend: ${{ steps.scope.outputs.backend }}
      projection: ${{ steps.scope.outputs.projection }}
      distribution: ${{ steps.scope.outputs.distribution }}
      generated_backend: ${{ steps.scope.outputs.generated_backend }}
      frontend: ${{ steps.scope.outputs.frontend }}
      release_plan_check: ${{ steps.release_scope.outputs.release_plan_check }}
      readmes: ${{ steps.scope.outputs.readmes }}
      backend_mode: ${{ steps.scope.outputs.backend_mode }}
      maven_projects: ${{ steps.scope.outputs.maven_projects }}
      maven_dependency_projects: ${{ steps.scope.outputs.maven_dependency_projects }}
      m08: ${{ steps.assurance.outputs.m08 }}
      m09: ${{ steps.assurance.outputs.m09 }}
      m10: ${{ steps.assurance.outputs.m10 }}
      m11: ${{ steps.assurance.outputs.m11 }}
      m12: ${{ steps.assurance.outputs.m12 }}
      m13: ${{ steps.assurance.outputs.m13 }}
      m14: ${{ steps.assurance.outputs.m14 }}
      m15: ${{ steps.assurance.outputs.m15 }}
      m16: ${{ steps.assurance.outputs.m16 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The canonical PMO package and release projection checks invoke pnpm directly.
      - name: Set up pnpm for common PMO gates
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js for common PMO gates
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Install release classifier dependencies
        run: >-
          pnpm --dir mango-ui install
          --frozen-lockfile
          --ignore-scripts
          --filter mango-ui
          --registry=https://registry.npmjs.org/

      - name: Read policy-resolved assurance selections
        id: assurance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > .pr-body.md
          node mango-pmo/tools/assurance-ci-scope.mjs --body .pr-body.md >> "$GITHUB_OUTPUT"

      - name: Classify affected governance and Maven scope
        id: scope
        run: |
          node mango-pmo/tools/classify-pmo-check-scope.mjs \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --output "$GITHUB_OUTPUT"

      - name: Classify release plan gate
        id: release_scope
        run: |
          node mango-ui/scripts/release/classify-release-pr.mjs \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}

  release_plan:
    name: Release plan gate
    needs: preflight_scope
    if: needs.preflight_scope.outputs.release_plan_check == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for release plan validation
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Validate accumulated successful release baseline
        run: node mango-ui/scripts/release/check-release-plan.mjs

  frontend_unit:
    name: Frontend unit tests and component contracts
    needs: preflight_scope
    # Frontend source changes must run the vitest suites and the component contract check;
    # without this job the suites only ever ran on a developer machine (issue #1349).
    if: >-
      needs.preflight_scope.outputs.frontend == 'true' &&
      needs.preflight_scope.outputs.m09 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm for frontend unit tests
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0
          run_install: false

      - name: Set up Node.js for frontend unit tests
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Install locked frontend dependencies
        run: >-
          pnpm --dir mango-ui install
          --frozen-lockfile
          --ignore-scripts
          --registry=https://registry.npmjs.org/

      - name: Build workspace packages the suites import
        run: pnpm --dir mango-ui -r --filter "@mango/*" run build

      - name: Run workspace test scripts and component contract checks
        run: |
          set -o pipefail
          pnpm --dir mango-ui -r --if-present test 2>&1 | tee /tmp/frontend-unit.log
          pnpm --dir mango-ui component-contracts:check

      - name: Assert the suites actually executed
        run: |
          executed=$(grep -Eo 'Tests +[0-9]+ passed' /tmp/frontend-unit.log | grep -Eo '[0-9]+' | paste -sd+ - | bc)
          if [ -z "$executed" ] || [ "$executed" -eq 0 ]; then
            echo "::error::no frontend unit test executed; the suites were collected but ran nothing"
            exit 1
          fi
          echo "frontend unit tests executed: $executed" >> "$GITHUB_STEP_SUMMARY"

  pmo:
    name: PMO gates
    needs: preflight_scope
    if: >-
      (needs.preflight_scope.outputs.pmo == 'true' ||
      needs.preflight_scope.outputs.backend_mode == 'governance') &&
      (needs.preflight_scope.outputs.m09 == 'true' ||
      needs.preflight_scope.outputs.m10 == 'true' ||
      needs.preflight_scope.outputs.m11 == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The reproducible PMO package build and check invoke pnpm directly.
      - name: Enable pnpm for PMO package gates
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: corepack enable pnpm

      - name: Set up Node.js for PMO gates
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Test document contracts, lifecycle routing, and Skills
        if: needs.preflight_scope.outputs.pmo == 'true' && needs.preflight_scope.outputs.m10 == 'true'
        run: |
          node --test \
            mango-pmo/tests/architecture-debt-budget.test.mjs \
            mango-pmo/tests/branch-protection-policy.test.mjs \
            mango-pmo/tests/document-contract/document-contract.test.mjs \
            mango-pmo/tests/frontend-page-baseline.test.mjs \
            mango-pmo/tests/pmo-check-scope.test.mjs \
            mango-pmo/tests/pmo-preflight.test.mjs \
            mango-pmo/tests/readme-audit-scope.test.mjs \
            mango-pmo/tests/risk-verification.test.mjs \
            mango-pmo/tests/standard-delivery-record.test.mjs \
            mango-pmo/tests/surefire-version-check.test.mjs \
            mango-pmo/tests/test-quality-check.test.mjs \
            mango-pmo/tests/workflow-contract-fingerprint.test.mjs \
            mango-pmo/tests/workspace-layout-check.test.mjs
          node mango-pmo/tests/skills/check-skill-evals.mjs
          node mango-pmo/tests/skills/check-delivery-mode-history-cases.mjs

      - name: Run selected static PMO checks
        if: needs.preflight_scope.outputs.pmo == 'true' && needs.preflight_scope.outputs.m09 == 'true'
        run: |
          node mango-pmo/tools/check-pmo-preflight.mjs
          node mango-pmo/tools/check-governance-intent.mjs
          node mango-pmo/tests/skills/check-delivery-assurance-recommendations.mjs

      - name: Build and verify the reproducible PMO package
        if: needs.preflight_scope.outputs.distribution != 'true' && needs.preflight_scope.outputs.m11 == 'true'
        run: |
          node mango-ui/packages/mango-pmo/scripts/build-package.mjs
          node mango-ui/packages/mango-pmo/scripts/check-package.mjs

  cli_js:
    name: CLI and JavaScript gates
    needs: preflight_scope
    if: >-
      (needs.preflight_scope.outputs.projection == 'true' ||
      needs.preflight_scope.outputs.distribution == 'true' ||
      needs.preflight_scope.outputs.frontend == 'true') &&
      (needs.preflight_scope.outputs.m09 == 'true' || needs.preflight_scope.outputs.m11 == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm for CLI gates
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js for CLI gates
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Install workspace dependencies for published frontend packages
        if: needs.preflight_scope.outputs.frontend == 'true'
        run: >-
          pnpm --dir mango-ui install
          --frozen-lockfile
          --ignore-scripts
          --registry=https://registry.npmjs.org/

      - name: Build published frontend packages and verify package exports
        if: needs.preflight_scope.outputs.frontend == 'true'
        run: |
          pnpm --dir mango-ui -r --filter "@mango/*" run build
          node mango-ui/scripts/check-package-exports.mjs

      - name: Build and verify the reproducible PMO package for CLI tests
        if: needs.preflight_scope.outputs.distribution == 'true' && needs.preflight_scope.outputs.m11 == 'true'
        run: |
          node mango-ui/packages/mango-pmo/scripts/build-package.mjs
          node mango-ui/packages/mango-pmo/scripts/check-package.mjs

      - name: Install CLI runtime dependencies from the frozen lockfile
        if: needs.preflight_scope.outputs.distribution == 'true' && needs.preflight_scope.outputs.m11 == 'true'
        run: >-
          pnpm --dir mango-ui install
          --frozen-lockfile
          --filter @mango/cli...
          --ignore-scripts
          --registry=https://registry.npmjs.org/

      - name: Check canonical business starter and CLI projection
        if: needs.preflight_scope.outputs.projection == 'true' && needs.preflight_scope.outputs.m09 == 'true'
        run: |
          node mango-business-starter/scripts/check-template.mjs
          node mango-ui/packages/mango-cli/scripts/check-business-module-template.mjs

      - name: Test CLI PMO install, upgrade, rollback, and package contracts
        if: needs.preflight_scope.outputs.distribution == 'true' && needs.preflight_scope.outputs.m11 == 'true'
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          node mango-ui/packages/mango-cli/scripts/check-release-versions.mjs
          node mango-ui/packages/mango-cli/scripts/check-cli.mjs
          node --test mango-ui/packages/mango-cli/tests/*.test.mjs

  java:
    name: Java gates
    needs: preflight_scope
    if: >-
      (needs.preflight_scope.outputs.backend == 'true' ||
      needs.preflight_scope.outputs.generated_backend == 'true' ||
      needs.preflight_scope.outputs.backend_mode == 'governance') &&
      (needs.preflight_scope.outputs.m09 == 'true' ||
      needs.preflight_scope.outputs.m10 == 'true' ||
      needs.preflight_scope.outputs.m11 == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm for generated backend gates
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js for generated backend gates
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Set up Java for backend architecture gates
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            mango/pom.xml
            mango/**/pom.xml

      # Surefire 2.x 发现不了 JUnit 5 用例，Tests run: 0 会让整模块测试静默空跑。
      # 根 POM 统一声明 3.2.5 之后，用这个检查防止版本漂移把门禁又变回空跑。
      - name: Enforce unified Surefire version baseline
        run: node mango-pmo/tools/check-surefire-versions.mjs

      - name: Build the local PMO bundle for generated project acceptance
        if: >-
          needs.preflight_scope.outputs.m11 == 'true' &&
          (needs.preflight_scope.outputs.generated_backend == 'true' ||
          needs.preflight_scope.outputs.backend_mode == 'governance')
        run: node mango-ui/packages/mango-pmo/scripts/build-package.mjs

      - name: Install CLI runtime dependencies for generated backend acceptance
        if: >-
          needs.preflight_scope.outputs.m11 == 'true' &&
          (needs.preflight_scope.outputs.generated_backend == 'true' ||
          needs.preflight_scope.outputs.backend_mode == 'governance')
        run: >-
          pnpm --dir mango-ui install
          --frozen-lockfile
          --filter @mango/cli...
          --ignore-scripts
          --registry=https://registry.npmjs.org/

      - name: Build the architecture gate prerequisites
        run: |
          mvn -f mango/pom.xml \
            -pl :mango-bom,:mango-parent,:mango-common,:mango-tools \
            -DskipTests \
            install

      - name: Test and install the current Java architecture gate
        run: |
          mvn -f mango/pom.xml \
            -pl :mango-architecture-rules,:mango-maven-plugin \
            -DskipTests=${{ needs.preflight_scope.outputs.m10 != 'true' }} \
            install

      - name: Build affected-module upstream dependencies
        if: >-
          needs.preflight_scope.outputs.m09 == 'true' &&
          needs.preflight_scope.outputs.backend_mode == 'partial' &&
          needs.preflight_scope.outputs.maven_dependency_projects != ''
        env:
          MAVEN_DEPENDENCY_PROJECTS: ${{ needs.preflight_scope.outputs.maven_dependency_projects }}
        run: |
          mvn -f mango/pom.xml \
            -pl "$MAVEN_DEPENDENCY_PROJECTS" \
            -am \
            -DskipTests \
            -Denforcer.skip=true \
            -Dcheckstyle.skip=true \
            -Dpmd.skip=true \
            -Dspotbugs.skip=true \
            install

      - name: Build generated four-layer backend prerequisites
        if: >-
          needs.preflight_scope.outputs.m11 == 'true' &&
          (needs.preflight_scope.outputs.generated_backend == 'true' ||
          needs.preflight_scope.outputs.backend_mode == 'governance')
        run: |
          mvn -f mango/pom.xml \
            -pl :mango,:mango-parent,:mango-common,:mango-infra,:mango-infra-bootstrap,:mango-infra-bootstrap-api,:mango-infra-module,:mango-infra-module-api,:mango-infra-kv,:mango-infra-kv-api,:mango-infra-persistence,:mango-infra-persistence-api,:mango-infra-context,:mango-infra-context-api,:mango-infra-context-support,:mango-infra-context-starter,:mango-infra-persistence-starter,:mango-infra-web,:mango-infra-web-api,:mango-resource,:mango-resource-api,:mango-authorization,:mango-authorization-api,:mango-infra-web-support,:mango-infra-web-starter,:mango-infra-persistence-web-starter,:mango-infra-feign-starter,:mango-admin-starter \
            -am \
            -DskipTests \
            -Dcheckstyle.skip=true \
            -Dpmd.skip=true \
            -Dspotbugs.skip=true \
            install

      - name: Run tests for directly modified modules
        if: >-
          needs.preflight_scope.outputs.m09 == 'true' &&
          needs.preflight_scope.outputs.backend_mode == 'partial' &&
          needs.preflight_scope.outputs.maven_projects != ''
        env:
          MAVEN_PROJECTS: ${{ needs.preflight_scope.outputs.maven_projects }}
        run: |
          mvn -B -f mango/pom.xml \
            -pl "$MAVEN_PROJECTS" \
            -Denforcer.skip=true \
            -DskipTests=false \
            -Dmango.architecture.skip=true \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

      - name: Enforce affected-module architecture and Java quality contracts
        if: needs.preflight_scope.outputs.m09 == 'true' && needs.preflight_scope.outputs.backend_mode == 'partial'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAVEN_PROJECTS: ${{ needs.preflight_scope.outputs.maven_projects }}
        run: |
          mvn -f mango/pom.xml \
            -pl "$MAVEN_PROJECTS" \
            -DskipTests \
            -Dmango.architecture.skip=false \
            -Dmango.architecture.mode=changed \
            -Dmango.architecture.requireFullReactor=false \
            -Dmango.architecture.base="$BASE_SHA" \
            -Dmango.check.changedOnly=true \
            -Dmango.check.gate=no-new-violations \
            -Dmango.check.baseRef="$BASE_SHA" \
            verify

      - name: Detect architecture inventory sensitivity
        if: needs.preflight_scope.outputs.m09 == 'true' && needs.preflight_scope.outputs.backend_mode == 'governance'
        id: architecture_scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA...HEAD")"
          if printf '%s\n' "$changed" | grep -Eq '^(mango-pmo/baselines/|mango/mango-tools/mango-architecture-|mango/mango-tools/mango-maven-plugin/src/main/resources/rulesets/|mango/mango-tools/mango-maven-plugin/src/main/java/io/mango/plugin/architecture/|mango/pom\.xml$|mango/mango-parent/pom\.xml$)'; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
            echo "本次改动不涉及架构基线、规则集或架构规则代码，跳过全量架构清点（预算仍按已提交基线校验）。"
          fi

      - name: Generate trusted full-Reactor architecture inventory for governance
        if: >-
          needs.preflight_scope.outputs.m09 == 'true' &&
          needs.preflight_scope.outputs.backend_mode == 'governance' &&
          steps.architecture_scope.outputs.value == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mvn -f mango/pom.xml \
            -DskipTests \
            -Dmango.architecture.skip=false \
            -Dmango.architecture.mode=changed \
            -Dmango.architecture.requireFullReactor=true \
            -Dmango.architecture.inventoryOnly=true \
            -Dmango.architecture.base="$BASE_SHA" \
            -Dmango.check.changedOnly=false \
            -Dmango.check.gate=no-new-violations \
            -Dmango.check.baseRef="$BASE_SHA" \
            verify

      - name: Enforce committed architecture debt budget policy
        if: >-
          needs.preflight_scope.outputs.m09 == 'true' &&
          (needs.preflight_scope.outputs.backend == 'true' ||
          needs.preflight_scope.outputs.backend_mode == 'governance')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BACKEND_MODE: ${{ needs.preflight_scope.outputs.backend_mode }}
          FRESH_INVENTORY: ${{ steps.architecture_scope.outputs.value }}
        run: |
          if [ "$BACKEND_MODE" = "governance" ] && [ "$FRESH_INVENTORY" = "true" ]; then
            node mango-pmo/tools/check-architecture-debt-budget.mjs --base-ref "$BASE_SHA"
          else
            node mango-pmo/tools/check-architecture-debt-budget.mjs --baseline-only --base-ref "$BASE_SHA"
          fi

      - name: Verify generated business backend gates
        if: >-
          needs.preflight_scope.outputs.m11 == 'true' &&
          (needs.preflight_scope.outputs.generated_backend == 'true' ||
          needs.preflight_scope.outputs.backend_mode == 'governance')
        env:
          MANGO_BACKEND_GATE_VERSION: 1.0.0-SNAPSHOT
        run: node mango-ui/packages/mango-cli/scripts/check-generated-backend-gate.mjs

      - name: Enforce backend module metadata
        if: needs.preflight_scope.outputs.m09 == 'true' && needs.preflight_scope.outputs.backend == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mvn -f mango/pom.xml \
            -pl :mango-architecture-verification \
            io.mango.tools.maven.plugin:mango-maven-plugin:1.0.0-SNAPSHOT:check \
            -Drule=module-info \
            -DbaseDir="${{ github.workspace }}" \
            -Dmango.check.changedOnly=true \
            -Dmango.check.gate=no-new-violations \
            -Dmango.check.baseRef="$BASE_SHA" \
            -Doutput=json \
            -DreportFile="${{ github.workspace }}/.runtime/pmo/backend-module-info.json"

  workflow_contract:
    name: Workflow API contract sentinel
    needs: preflight_scope
    if: >-
      needs.preflight_scope.outputs.backend == 'true' &&
      (contains(needs.preflight_scope.outputs.maven_projects, 'mango-workflow') ||
      needs.preflight_scope.outputs.backend_mode == 'governance')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java for workflow contract tests
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            mango/pom.xml
            mango/**/pom.xml

      - name: Build the Java architecture gate plugin
        run: |
          mvn -B -f mango/pom.xml \
            -pl :mango-bom,:mango-parent,:mango-common,:mango-tools \
            -DskipTests \
            install
          mvn -B -f mango/pom.xml \
            -pl :mango-architecture-rules,:mango-maven-plugin \
            -DskipTests \
            install

      # workflow 模块不继承 mango-parent，Surefire 版本由根 POM pluginManagement 统一到 3.2.5，
      # 因此普通 test 生命周期就能发现 JUnit 5 用例，这里等于把整模块测试纳入门禁。
      - name: Build workflow starter with reactor prerequisites
        run: |
          mvn -B -f mango/pom.xml \
            -pl :mango-workflow-starter \
            -am \
            -DskipTests \
            -Denforcer.skip=true \
            -Dcheckstyle.skip=true \
            -Dpmd.skip=true \
            -Dspotbugs.skip=true \
            -Dmango.architecture.skip=true \
            install

      - name: Run workflow starter tests including the API surface contract sentinel
        run: |
          mvn -B -f mango/pom.xml \
            -pl :mango-workflow-starter \
            -Denforcer.skip=true \
            -DskipTests=false \
            -Dmango.architecture.skip=true \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test

  docs:
    name: Documentation gates
    needs: preflight_scope
    if: needs.preflight_scope.outputs.readmes == 'true' || needs.preflight_scope.outputs.m08 == 'true' || needs.preflight_scope.outputs.m09 == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for documentation gates
        uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"

      - name: Check governance intent
        if: needs.preflight_scope.outputs.pmo == 'true' && needs.preflight_scope.outputs.m09 == 'true'
        run: node mango-pmo/tools/check-governance-intent.mjs

      # 下面三个仓库级 README 审计按改动范围（readmes scope）触发，与 PR body 里声明的 M08 无关：
      # 它们校验的是仓库 README 结构不变量，改到 README 就必须跑，否则会在合入后才让 main 变红（issue #1344）。
      - name: Audit module README quality
        if: needs.preflight_scope.outputs.readmes == 'true'
        run: node mango-pmo/tools/audit-module-readmes.mjs

      - name: Audit README source facts
        if: needs.preflight_scope.outputs.readmes == 'true'
        run: node mango-pmo/tools/audit-readme-source-facts.mjs

      - name: Check business integration guides
        if: needs.preflight_scope.outputs.readmes == 'true'
        run: node mango-pmo/tools/check-business-guides.mjs

      - name: Check capability docs governance
        if: needs.preflight_scope.outputs.m08 == 'true'
        run: |
          node mango-pmo/tools/check-capability-docs.mjs \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}

  pmo-doc-check:
    name: pmo-doc-check
    needs: [preflight_scope, release_plan, pmo, cli_js, frontend_unit, java, workflow_contract, docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Aggregate PMO gate results
        env:
          PREFLIGHT_SCOPE_RESULT: ${{ needs.preflight_scope.result }}
          RELEASE_PLAN_RESULT: ${{ needs.release_plan.result }}
          PMO_RESULT: ${{ needs.pmo.result }}
          CLI_JS_RESULT: ${{ needs.cli_js.result }}
          FRONTEND_UNIT_RESULT: ${{ needs.frontend_unit.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          WORKFLOW_CONTRACT_RESULT: ${{ needs.workflow_contract.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          {
            echo '### PMO gate results'
            echo '| Job | Result |'
            echo '| --- | --- |'
            echo "| preflight_scope | $PREFLIGHT_SCOPE_RESULT |"
            echo "| release_plan | $RELEASE_PLAN_RESULT |"
            echo "| pmo | $PMO_RESULT |"
            echo "| cli_js | $CLI_JS_RESULT |"
            echo "| frontend_unit | $FRONTEND_UNIT_RESULT |"
            echo "| java | $JAVA_RESULT |"
            echo "| workflow_contract | $WORKFLOW_CONTRACT_RESULT |"
            echo "| docs | $DOCS_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

          for result in \
            "$PREFLIGHT_SCOPE_RESULT" \
            "$RELEASE_PLAN_RESULT" \
            "$PMO_RESULT" \
            "$CLI_JS_RESULT" \
            "$FRONTEND_UNIT_RESULT" \
            "$JAVA_RESULT" \
            "$WORKFLOW_CONTRACT_RESULT" \
            "$DOCS_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
