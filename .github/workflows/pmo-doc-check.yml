name: PMO Documentation Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  pmo-doc-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > .pr-body.md

      - name: Check PMO preflight routing
        run: node mango-pmo/tools/check-pmo-preflight.mjs

      - name: Check executable quality gate fixtures
        run: node mango-pmo/tools/quality-gate.mjs --self-test

      - name: Run isolated deterministic gate A/B evaluation
        run: node mango-pmo/tools/eval-executable-quality.mjs

      - name: Validate isolated Agent classification experiment
        run: node mango-pmo/tools/eval-agent-classification.mjs --validate-only

      - name: Set up Java for targeted mutation verification
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven quality-gate entry
        run: |
          mvn -f mango/pom.xml \
            -pl mango-tools/mango-maven-plugin -am \
            -Dtest=QualityGateMojoTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            install
          mvn -f mango/pom.xml \
            io.mango.tools.maven.plugin:mango-maven-plugin:1.0.0-SNAPSHOT:quality-gate \
            -Dmango.quality.baseRef=${{ github.event.pull_request.base.sha }} \
            -Dmango.quality.headRef=${{ github.event.pull_request.head.sha }} \
            -Dmango.quality.report=.runtime/pmo/maven-quality-gate.json

      - name: Verify targeted business mutations
        run: node mango-pmo/tools/verify-targeted-mutations.mjs

      - name: Check changed files with executable quality gate
        run: |
          node mango-pmo/tools/quality-gate.mjs \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --report .runtime/pmo/changed-quality-gate.json

      - name: Check latest test baselines
        run: |
          node mango-pmo/tools/quality-baseline.mjs self-test
          node mango-pmo/tools/quality-baseline.mjs check

      - name: Build and verify versioned PMO package
        run: |
          node mango-ui/packages/mango-pmo/scripts/build-package.mjs
          node mango-ui/packages/mango-pmo/scripts/check-package.mjs

      - name: Check governance intent
        run: node mango-pmo/tools/check-governance-intent.mjs

      - name: Audit module README quality
        run: node mango-pmo/tools/audit-module-readmes.mjs

      - name: Audit README source facts
        run: node mango-pmo/tools/audit-readme-source-facts.mjs

      - name: Check business integration guides
        run: node mango-pmo/tools/check-business-guides.mjs

      - name: Check capability docs governance
        env:
          PR_BODY_FILE: .pr-body.md
        run: |
          node mango-pmo/tools/check-capability-docs.mjs \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}
