name: PMO Documentation Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pmo-doc-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preflight_scope:
    name: Preflight and scope
    runs-on: ubuntu-latest
    outputs:
      pmo: ${{ steps.scope.outputs.pmo }}
      backend: ${{ steps.scope.outputs.backend }}
      projection: ${{ steps.scope.outputs.projection }}
      distribution: ${{ steps.scope.outputs.distribution }}
      generated_backend: ${{ steps.scope.outputs.generated_backend }}
      readmes: ${{ steps.scope.outputs.readmes }}
      backend_mode: ${{ steps.scope.outputs.backend_mode }}
      maven_projects: ${{ steps.scope.outputs.maven_projects }}
      maven_dependency_projects: ${{ steps.scope.outputs.maven_dependency_projects }}
      m08: ${{ steps.assurance.outputs.m08 }}
      m09: ${{ steps.assurance.outputs.m09 }}
      m10: ${{ steps.assurance.outputs.m10 }}
      m11: ${{ steps.assurance.outputs.m11 }}
      m12: ${{ steps.assurance.outputs.m12 }}
      m13: ${{ steps.assurance.outputs.m13 }}
      m14: ${{ steps.assurance.outputs.m14 }}
      m15: ${{ steps.assurance.outputs.m15 }}
      m16: ${{ steps.assurance.outputs.m16 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for common PMO gates
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read policy-resolved assurance selections
        id: assurance
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > .pr-body.md
          node mango-pmo/tools/assurance-ci-scope.mjs --body .pr-body.md >> "$GITHUB_OUTPUT"

      - name: Classify affected governance and Maven scope
        id: scope
        run: |
          node mango-pmo/tools/classify-pmo-check-scope.mjs \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }} \
            --output "$GITHUB_OUTPUT"

  pmo:
    name: PMO gates
    needs: preflight_scope
    if: >-
      (needs.preflight_scope.outputs.pmo == 'true' ||
      needs.preflight_scope.outputs.backend_mode == 'governance') &&
      (needs.preflight_scope.outputs.m09 == 'true' ||
      needs.preflight_scope.outputs.m10 == 'true' ||
      needs.preflight_scope.outputs.m11 == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm for PMO tarball verification
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js for PMO gates
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test document contracts, lifecycle routing, and Skills
        if: needs.preflight_scope.outputs.pmo == 'true'
        run: |
          node --test \
            mango-pmo/tests/architecture-debt-budget.test.mjs \
            mango-pmo/tests/branch-protection-policy.test.mjs \
            mango-pmo/tests/document-contract/document-contract.test.mjs \
            mango-pmo/tests/pmo-check-scope.test.mjs \
            mango-pmo/tests/pmo-preflight.test.mjs \
            mango-pmo/tests/risk-verification.test.mjs \
            mango-pmo/tests/standard-delivery-record.test.mjs \
            mango-pmo/tests/test-quality-check.test.mjs \
            mango-pmo/tests/workspace-layout-check.test.mjs
          node mango-pmo/tests/skills/check-skill-evals.mjs
          node mango-pmo/tests/skills/check-delivery-mode-history-cases.mjs

      - name: Run selected static PMO checks
        if: needs.preflight_scope.outputs.pmo == 'true'
        run: |
          node mango-pmo/tools/check-pmo-preflight.mjs
          node mango-pmo/tools/check-governance-intent.mjs
          node mango-pmo/tests/skills/check-delivery-assurance-recommendations.mjs

      - name: Build and verify the reproducible PMO package
        if: needs.preflight_scope.outputs.distribution != 'true' && needs.preflight_scope.outputs.m11 == 'true'
        run: |
          node mango-ui/packages/mango-pmo/scripts/build-package.mjs
          node mango-ui/packages/mango-pmo/scripts/check-package.mjs

  cli_js:
    name: CLI and JavaScript gates
    needs: preflight_scope
    if: >-
      (needs.preflight_scope.outputs.projection == 'true' ||
      needs.preflight_scope.outputs.distribution == 'true') &&
      (needs.preflight_scope.outputs.m09 == 'true' || needs.preflight_scope.outputs.m11 == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm for CLI gates
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js for CLI gates
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and verify the reproducible PMO package for CLI tests
        if: needs.preflight_scope.outputs.distribution == 'true' && needs.preflight_scope.outputs.m11 == 'true'
        run: |
          node mango-ui/packages/mango-pmo/scripts/build-package.mjs
          node mango-ui/packages/mango-pmo/scripts/check-package.mjs

      - name: Check canonical business starter and CLI projection
        if: needs.preflight_scope.outputs.projection == 'true' && needs.preflight_scope.outputs.m09 == 'true'
        run: |
          node mango-business-starter/scripts/check-template.mjs
          node mango-ui/packages/mango-cli/scripts/check-business-module-template.mjs

      - name: Test CLI PMO install, upgrade, rollback, and package contracts
        if: needs.preflight_scope.outputs.distribution == 'true' && needs.preflight_scope.outputs.m11 == 'true'
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
        run: |
          node mango-ui/packages/mango-cli/scripts/check-release-versions.mjs
          node mango-ui/packages/mango-cli/scripts/check-cli.mjs
          node --test mango-ui/packages/mango-cli/tests/*.test.mjs

  java:
    name: Java gates
    needs: preflight_scope
    if: >-
      (needs.preflight_scope.outputs.backend == 'true' ||
      needs.preflight_scope.outputs.generated_backend == 'true' ||
      needs.preflight_scope.outputs.backend_mode == 'governance') &&
      (needs.preflight_scope.outputs.m09 == 'true' ||
      needs.preflight_scope.outputs.m10 == 'true' ||
      needs.preflight_scope.outputs.m11 == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for generated backend gates
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java for backend architecture gates
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: |
            mango/pom.xml
            mango/**/pom.xml

      - name: Build the local PMO bundle for generated project acceptance
        if: >-
          needs.preflight_scope.outputs.m11 == 'true' &&
          (needs.preflight_scope.outputs.generated_backend == 'true' ||
          needs.preflight_scope.outputs.backend_mode == 'governance')
        run: node mango-ui/packages/mango-pmo/scripts/build-package.mjs

      - name: Build the architecture gate prerequisites
        run: |
          mvn -f mango/pom.xml \
            -pl :mango-parent,:mango-common,:mango-tools \
            -DskipTests \
            install

      - name: Test and install the current Java architecture gate
        run: |
          mvn -f mango/pom.xml \
            -pl :mango-architecture-rules,:mango-maven-plugin \
            -DskipTests=${{ needs.preflight_scope.outputs.m10 != 'true' }} \
            install

      - name: Build affected-module upstream dependencies
        if: >-
          needs.preflight_scope.outputs.m09 == 'true' &&
          needs.preflight_scope.outputs.backend_mode == 'partial' &&
          needs.preflight_scope.outputs.maven_dependency_projects != ''
        env:
          MAVEN_DEPENDENCY_PROJECTS: ${{ needs.preflight_scope.outputs.maven_dependency_projects }}
        run: |
          mvn -f mango/pom.xml \
            -pl "$MAVEN_DEPENDENCY_PROJECTS" \
            -am \
            -DskipTests \
            -Denforcer.skip=true \
            -Dcheckstyle.skip=true \
            -Dpmd.skip=true \
            -Dspotbugs.skip=true \
            install

      - name: Build generated four-layer backend prerequisites
        if: >-
          needs.preflight_scope.outputs.m11 == 'true' &&
          (needs.preflight_scope.outputs.generated_backend == 'true' ||
          needs.preflight_scope.outputs.backend_mode == 'governance')
        run: |
          mvn -f mango/pom.xml \
            -pl :mango,:mango-parent,:mango-common,:mango-infra,:mango-infra-module,:mango-infra-module-api,:mango-infra-kv,:mango-infra-kv-api,:mango-infra-persistence,:mango-infra-persistence-api,:mango-infra-context,:mango-infra-context-api,:mango-infra-context-support,:mango-infra-context-starter,:mango-infra-persistence-starter,:mango-infra-web,:mango-infra-web-api,:mango-resource,:mango-resource-api,:mango-authorization,:mango-authorization-api,:mango-infra-web-support,:mango-infra-web-starter,:mango-infra-persistence-web-starter,:mango-infra-feign-starter \
            -DskipTests \
            -Dcheckstyle.skip=true \
            -Dpmd.skip=true \
            -Dspotbugs.skip=true \
            install

      - name: Enforce affected-module architecture and Java quality contracts
        if: needs.preflight_scope.outputs.m09 == 'true' && needs.preflight_scope.outputs.backend_mode == 'partial'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MAVEN_PROJECTS: ${{ needs.preflight_scope.outputs.maven_projects }}
        run: |
          mvn -f mango/pom.xml \
            -pl "$MAVEN_PROJECTS" \
            -DskipTests \
            -Dmango.architecture.skip=false \
            -Dmango.architecture.mode=changed \
            -Dmango.architecture.requireFullReactor=false \
            -Dmango.architecture.base="$BASE_SHA" \
            -Dmango.check.changedOnly=true \
            -Dmango.check.gate=no-new-violations \
            -Dmango.check.baseRef="$BASE_SHA" \
            verify

      - name: Enforce committed architecture debt budget policy
        if: needs.preflight_scope.outputs.m09 == 'true' && needs.preflight_scope.outputs.backend == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          node mango-pmo/tools/check-architecture-debt-budget.mjs
          --baseline-only
          --base-ref "$BASE_SHA"

      - name: Verify generated business backend gates
        if: >-
          needs.preflight_scope.outputs.m11 == 'true' &&
          (needs.preflight_scope.outputs.generated_backend == 'true' ||
          needs.preflight_scope.outputs.backend_mode == 'governance')
        env:
          MANGO_BACKEND_GATE_VERSION: 1.0.0-SNAPSHOT
        run: node mango-ui/packages/mango-cli/scripts/check-generated-backend-gate.mjs

      - name: Enforce backend module metadata
        if: needs.preflight_scope.outputs.m09 == 'true' && needs.preflight_scope.outputs.backend == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mvn -f mango/pom.xml \
            -pl :mango-architecture-verification \
            io.mango.tools.maven.plugin:mango-maven-plugin:1.0.0-SNAPSHOT:check \
            -Drule=module-info \
            -DbaseDir="${{ github.workspace }}" \
            -Dmango.check.changedOnly=true \
            -Dmango.check.gate=no-new-violations \
            -Dmango.check.baseRef="$BASE_SHA" \
            -Doutput=json \
            -DreportFile="${{ github.workspace }}/.runtime/pmo/backend-module-info.json"

  docs:
    name: Documentation gates
    needs: preflight_scope
    if: needs.preflight_scope.outputs.m08 == 'true' || needs.preflight_scope.outputs.m09 == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js for documentation gates
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check governance intent
        if: needs.preflight_scope.outputs.pmo == 'true' && needs.preflight_scope.outputs.m09 == 'true'
        run: node mango-pmo/tools/check-governance-intent.mjs

      - name: Audit module README quality
        if: needs.preflight_scope.outputs.readmes == 'true' && needs.preflight_scope.outputs.m08 == 'true'
        run: node mango-pmo/tools/audit-module-readmes.mjs

      - name: Audit README source facts
        if: needs.preflight_scope.outputs.readmes == 'true' && needs.preflight_scope.outputs.m08 == 'true'
        run: node mango-pmo/tools/audit-readme-source-facts.mjs

      - name: Check business integration guides
        if: needs.preflight_scope.outputs.readmes == 'true' && needs.preflight_scope.outputs.m08 == 'true'
        run: node mango-pmo/tools/check-business-guides.mjs

      - name: Check capability docs governance
        if: needs.preflight_scope.outputs.m08 == 'true'
        run: |
          node mango-pmo/tools/check-capability-docs.mjs \
            --base ${{ github.event.pull_request.base.sha }} \
            --head ${{ github.event.pull_request.head.sha }}

  pmo-doc-check:
    name: pmo-doc-check
    needs: [preflight_scope, pmo, cli_js, java, docs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate PMO gate results
        env:
          PREFLIGHT_SCOPE_RESULT: ${{ needs.preflight_scope.result }}
          PMO_RESULT: ${{ needs.pmo.result }}
          CLI_JS_RESULT: ${{ needs.cli_js.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
        run: |
          for result in \
            "$PREFLIGHT_SCOPE_RESULT" \
            "$PMO_RESULT" \
            "$CLI_JS_RESULT" \
            "$JAVA_RESULT" \
            "$DOCS_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
