name: Mango Internal Release Request

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: mango-internal-release-request-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  publish-request:
    name: Publish internal release request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the published release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Validate release and create request manifest
        env:
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_URL: ${{ github.event.release.html_url }}
          PUBLISHED_AT: ${{ github.event.release.published_at }}
        run: |
          set -euo pipefail
          if ! printf '%s' "${RELEASE_TAG}" | grep -Eq '^[0-9A-Za-z._+-]{1,160}$'; then
            echo "Release tag contains unsupported characters: ${RELEASE_TAG}" >&2
            exit 1
          fi

          git fetch --force --no-tags origin main
          source_sha="$(git rev-parse HEAD^{commit})"
          if ! git merge-base --is-ancestor "${source_sha}" origin/main; then
            echo "Release commit is not reachable from origin/main: ${source_sha}" >&2
            exit 1
          fi

          locked_version="$(node -e 'const v=require("./mango-ui/packages/mango-cli/release-versions.json"); process.stdout.write(v.maven.mangoBackend)')"
          maven_version=""
          if [[ "-${RELEASE_TAG}-" == *"-maven-${locked_version}-"* ]]; then
            maven_version="${locked_version}"
            if ! grep -Fq "maven-${maven_version}" CHANGELOG.md; then
              echo "CHANGELOG.md does not contain maven-${maven_version}." >&2
              exit 1
            fi
          fi

          node - "${RELEASE_ID}" "${RELEASE_TAG}" "${source_sha}" "${RELEASE_URL}" "${PUBLISHED_AT}" "${maven_version}" <<'NODE'
          const fs = require('node:fs')
          const [releaseId, tag, sourceSha, releaseUrl, publishedAt, mavenVersion] = process.argv.slice(2)
          const request = {
            schema: 'mango.internal-release-request/v1',
            repository: process.env.GITHUB_REPOSITORY,
            releaseId: Number(releaseId),
            tag,
            sourceSha,
            releaseUrl,
            publishedAt,
            components: {
              maven: mavenVersion ? { version: mavenVersion, runTests: false } : null,
            },
          }
          fs.writeFileSync('mango-internal-release-request-v1.json', `${JSON.stringify(request, null, 2)}\n`)
          NODE

      - name: Attach the internal release request
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${RELEASE_TAG}" mango-internal-release-request-v1.json

      - name: Write summary
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            echo "## Internal release request"
            echo
            echo "- Release: \`${RELEASE_TAG}\`"
            echo "- Request asset: \`mango-internal-release-request-v1.json\`"
            echo "- Internal Jenkins discovers the request within two minutes."
            echo "- Nexus verification, not this workflow, is the final publication result."
          } >> "${GITHUB_STEP_SUMMARY}"
