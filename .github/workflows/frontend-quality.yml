name: Frontend Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend-pr-quality:
    name: frontend-pr-quality
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Report temporary pause
        run: |
          echo "::notice title=Frontend PR quality paused::Mango pull-request frontend quality checks are temporarily paused."
          echo "frontend-pr-quality remains successful so the required branch-protection context stays available."
          echo "Push and manual frontend quality workflows remain unchanged."

  frontend-quality:
    name: frontend-quality
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: mango-ui/pnpm-lock.yaml

      - name: Install locked frontend dependencies
        working-directory: mango-ui
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Run main frontend quality gate
        if: github.event_name == 'push'
        working-directory: mango-ui
        env:
          MANGO_BASE_SHA: ${{ github.event.before }}
          MANGO_HEAD_SHA: ${{ github.sha }}
        run: pnpm check:affected -- --base="$MANGO_BASE_SHA" --head="$MANGO_HEAD_SHA"

      - name: Enforce current frontend page components
        if: github.event_name == 'push'
        env:
          MANGO_BASE_SHA: ${{ github.event.before }}
          MANGO_HEAD_SHA: ${{ github.sha }}
        run: >-
          node mango-pmo/tools/check-frontend-page-baseline.mjs
          --base "$MANGO_BASE_SHA"
          --head "$MANGO_HEAD_SHA"
          --frontend-root mango-ui

      - name: Run manual full frontend quality gate
        if: github.event_name == 'workflow_dispatch'
        working-directory: mango-ui
        run: pnpm check

      - name: Upload frontend quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-quality-${{ github.sha }}
          path: .runtime/frontend-quality
          if-no-files-found: warn
          retention-days: 30

  frontend-e2e-p0:
    name: frontend-e2e-p0
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.14.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: pnpm
          cache-dependency-path: mango-ui/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install Mango backend prerequisites
        run: |
          mvn -f mango/pom.xml \
            -pl :mango-bom,:mango-parent,:mango-common,:mango-tools \
            -DskipTests \
            install

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes mysql-client

      - name: Install locked frontend dependencies
        working-directory: mango-ui
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org/

      - name: Install Chrome for Playwright
        run: pnpm --dir mango-ui exec playwright install --with-deps chrome

      - name: Initialize isolated Mango workspace
        run: node mango-ui/packages/mango-cli/src/index.mjs workspace init

      - name: Start real Mango backend
        run: node mango-ui/packages/mango-cli/src/index.mjs dev start backend

      - name: Wait for bootstrap identity and tenant
        run: |
          source .mango/dev-workspace.env
          : "${MANGO_BACKEND_PORT:?MANGO_BACKEND_PORT is missing from .mango/dev-workspace.env}"
          for attempt in $(seq 1 150); do
            response="$(curl --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"username":"admin","realm":"INTERNAL","appCode":"internal-admin"}' \
              "http://127.0.0.1:${MANGO_BACKEND_PORT}/auth/login-institutions" || true)"
            if BOOTSTRAP_RESPONSE="$response" node --input-type=module -e '
              let body = {};
              try {
                body = JSON.parse(process.env.BOOTSTRAP_RESPONSE || "{}");
              } catch {}
              const tenants = Array.isArray(body.data) ? body.data : [];
              const succeeded = body.success === true || body.code === 200;
              process.exit(succeeded && tenants.some((tenant) => tenant.tenantName === "芒果集团") ? 0 : 1);
            '; then
              exit 0
            fi
            sleep 2
          done
          echo "Bootstrap identity and tenant did not become ready within 5 minutes" >&2
          exit 1

      - name: Configure micro frontend hostnames
        run: |
          echo "127.0.0.1 a.mango.io b.mango.io c.mango.io d.mango.io e.mango.io" | sudo tee -a /etc/hosts >/dev/null
          getent hosts a.mango.io b.mango.io c.mango.io d.mango.io e.mango.io

      - name: Run P0 browser acceptance
        working-directory: mango-ui
        run: pnpm test:e2e:p0

      - name: Stop Mango development services
        if: always()
        continue-on-error: true
        run: node mango-ui/packages/mango-cli/src/index.mjs dev stop

      - name: Upload P0 browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-e2e-p0-${{ github.sha }}
          path: |
            .runtime/playwright
            mango-ui/test-results
            .mango/run/logs
          if-no-files-found: warn
          retention-days: 30
